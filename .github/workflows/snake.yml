name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # каждые 12 часов
  workflow_dispatch:          # запуск вручную из вкладки Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#4F46E5&color_dots=#e9e9ff,#a5abf8,#7C86F5,#5b5bd6,#4F46E5
            dist/snake-dark.svg?color_snake=#9AA2F8&color_dots=#12141a,#4F46E5,#6E77EF,#8E96F6,#B9BEFB

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
