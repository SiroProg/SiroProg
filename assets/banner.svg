<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="ind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA2F8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#161a20" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#08090A"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#1B1D21"/>

  <!-- фоновый watermark -->
  <text x="1150" y="250" text-anchor="end" fill="#0f1218" font-size="200" font-weight="800">&lt;/&gt;</text>

  <!-- терминал -->
  <text x="80" y="112" font-size="20" fill="#5F636B">
    <tspan fill="#4F46E5">~</tspan> $ <tspan fill="#8F949C">whoami</tspan>
  </text>

  <text x="80" y="184" font-size="58" font-weight="800" fill="#F4F5F6" letter-spacing="-1">anonymous</text>
  <rect x="470" y="150" width="20" height="44" fill="url(#ind)"/>

  <text x="82" y="224" font-size="16" fill="#8F949C">// a developer. no bio. just code in the dark.</text>

  <text x="1120" y="46" text-anchor="end" fill="#3a3f47" font-size="13" letter-spacing="1">[ access: restricted ]</text>
</svg>
